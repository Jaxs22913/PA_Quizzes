name: Deploy to Cloudflare (pa-quizzes.com)

# Runs beside pages.yml on every push to main, so GitHub Pages and Cloudflare
# always serve the same commit. A failure here never affects GitHub Pages.
# See docs/HOSTING_CLOUDFLARE.md.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare"
  cancel-in-progress: true   # only the newest commit matters

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dist/ (site under /PA_Quizzes/)
        run: node cloudflare/build.mjs

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not set yet; skipping the Cloudflare deploy."
            exit 0
          fi
          npx -y wrangler@4.138.0 deploy
