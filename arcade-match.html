<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('siteTheme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match — Arcade</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="arcade.css">
</head>
<body>
<svg class="edge-decor left" aria-hidden="true"></svg>
<svg class="edge-decor right" aria-hidden="true"></svg>
<div class="page page-wide">

  <div class="brand-row">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="10" rx="2"/><rect x="7" y="4" width="14" height="10" rx="2"/></svg>
      </div>
      <div class="brand-text">
        <h1>Study Arcade</h1>
        <p>Turn studying into a game</p>
      </div>
    </div>
  </div>
  <div class="streak-pill" id="streak-pill"><span class="flame">🔥</span><b id="streak-count">0</b><span>-day streak</span></div>

  <a class="back-link" href="arcade.html">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to decks
  </a>

  <div id="empty-container"></div>

  <div id="game-ui" style="display:none">
    <div class="match-stats">
      <div class="match-stat"><span class="num" id="match-timer">0.0s</span><span class="lbl">Time</span></div>
      <div class="match-stat"><span class="num" id="match-progress">0 / 0</span><span class="lbl">Matched</span></div>
      <div class="match-stat best"><span class="num" id="match-best">—</span><span class="lbl">Best</span></div>
    </div>
    <div class="match-bar">
      <div class="match-bar-track"><div class="match-bar-fill" id="match-bar-fill"></div></div>
      <span class="match-bar-count" id="match-bar-count">0 / 0</span>
    </div>

    <div class="match-controls">
      <label class="match-size" for="match-size">
        <span>Pairs on screen</span>
        <input type="number" id="match-size" min="2" step="1" inputmode="numeric">
      </label>
      <button type="button" class="match-fs" id="match-fs" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <span id="match-fs-label">Fullscreen</span>
      </button>
    </div>

    <div class="match-columns">
      <div class="match-col" id="match-terms"><div class="match-col-label">Terms</div></div>
      <div class="match-col" id="match-defs"><div class="match-col-label">Definitions</div></div>
    </div>
    <p class="keyhint">Tap a term, then tap its matching definition (either side first) — wrong pairs just shake and try again</p>
  </div>

  <div class="view" id="view-result" style="display:none">
    <div class="result-screen">
      <div class="result-icon win" id="result-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
      </div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="deck-actions">
        <a class="btn ghost" href="arcade.html">Back to decks</a>
        <button class="btn match" id="match-again-btn">Play again</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="semesters.js"></script>
<script src="arcade.js"></script>
<script src="theme.js" defer></script>
<script>
(function () {
  "use strict";

  // How many pairs sit on the board at once. When you clear one, the next pair
  // waiting in the pool pops in to take its place, same as Notability's Mix and
  // Match ("correct matches turn green and advance the quiz with new terms")
  // rather than dumping the whole deck on screen.
  //
  // Requested by David via Jaxon, 2026-08-20: "make it so people can type a
  // number and that many terms (with their corresponding def) will populate the
  // page." So it is a control rather than a constant, and it is remembered --
  // someone who wants ten rows wants ten rows next time too.
  var DEFAULT_WINDOW = 5;
  var WINDOW_KEY = "arcadeMatchWindow";

  function readWindowSize() {
    var n = parseInt(localStorage.getItem(WINDOW_KEY), 10);
    return (n && n >= 2) ? n : DEFAULT_WINDOW;
  }
  function writeWindowSize(n) {
    try { localStorage.setItem(WINDOW_KEY, String(n)); } catch (e) {}
  }
  var WINDOW_SIZE = readWindowSize();
  var deck = findDeck(deckIdFromURL());
  var pool = [], active = [], matchedCount = 0, totalPairs = 0;
  var selectedTermId = null, selectedDefIndex = null;
  var startTime = 0, timerInterval = null, locked = false;
  // Definitions are grouped by VALUE, not by pairId: some decks (e.g. an
  // organ deck where many organs are all "Retroperitoneal") have several
  // terms sharing one definition string. Rendering one tile per pairId used
  // to duplicate that string across the board, and matching by pairId
  // equality meant tapping a factually-correct-but-differently-numbered
  // duplicate was marked wrong. currentDefGroups instead holds one tile per
  // *unique* definition text among the active terms, each remembering which
  // pairIds it currently covers -- any of those terms can match against it,
  // and the tile only leaves the board once every term needing it is gone.
  var currentDefGroups = [];

  function showEmpty(msg) {
    document.getElementById("empty-container").innerHTML =
      '<div class="empty-state"><div class="big">🎉</div><p>' + msg + "</p></div>";
  }

  function buildPool(deck) {
    // matchCards (crisp term:definition pairs) is what Match is meant to
    // use -- deck.cards is the broader Study/Learn/Sprint content, which
    // reads as full questions and doesn't fit a tap-to-pair grid. Falls
    // back to deck.cards only for decks that predate the matchCards split.
    var source = deck.matchCards || deck.cards;
    var allPairs = shuffle(source.map(function (c, i) { return { pairId: i, term: c[0], def: c[1] }; }));
    totalPairs = allPairs.length;
    active = allPairs.slice(0, Math.min(WINDOW_SIZE, allPairs.length));
    pool = allPairs.slice(active.length);
  }

  function computeDefGroups() {
    var byValue = {}, order = [];
    active.forEach(function (p) {
      if (!byValue[p.def]) { byValue[p.def] = []; order.push(p.def); }
      byValue[p.def].push(p.pairId);
    });
    currentDefGroups = order.map(function (v) { return { value: v, pairIds: byValue[v] }; });
  }

  // Shuffling the two columns independently still lets a term's correct
  // definition land on the same row purely by chance -- with only
  // WINDOW_SIZE=5 rows on screen, that's roughly a 1-in-5 shot per row, so
  // across a full board it happens often enough to notice, not a rare
  // fluke. This swaps definition rows around (never changing which text is
  // ON the board, just where) until no row's term and definition are each
  // other's correct match. Capped at a handful of passes since the board
  // is always tiny (<= WINDOW_SIZE rows); if a safe swap genuinely can't
  // be found (e.g. only one row left on the board, where alignment is
  // unavoidable) it just leaves that row as-is rather than looping forever.
  function derangeDefGroups(termsOrder, defGroups) {
    var result = defGroups.slice();
    for (var attempt = 0; attempt < 20; attempt++) {
      var collisionIdx = -1;
      for (var i = 0; i < result.length; i++) {
        if (termsOrder[i].def === result[i].value) { collisionIdx = i; break; }
      }
      if (collisionIdx === -1) return result;
      var swapWith = -1;
      for (var k = 0; k < result.length; k++) {
        if (k === collisionIdx) continue;
        var collisionResolved = termsOrder[collisionIdx].def !== result[k].value;
        var kStillOk = termsOrder[k].def !== result[collisionIdx].value;
        if (collisionResolved && kStillOk) { swapWith = k; break; }
      }
      if (swapWith === -1) return result;
      var tmp = result[collisionIdx]; result[collisionIdx] = result[swapWith]; result[swapWith] = tmp;
    }
    return result;
  }

  function renderBoard() {
    var termsOrder = shuffle(active.slice());
    computeDefGroups();
    currentDefGroups = derangeDefGroups(termsOrder, shuffle(currentDefGroups));

    var termsEl = document.getElementById("match-terms");
    termsEl.innerHTML = '<div class="match-col-label">Terms</div>';
    termsOrder.forEach(function (pair) {
      var btn = document.createElement("button");
      btn.className = "match-item pop-in";
      btn.setAttribute("data-pair-id", pair.pairId);
      btn.textContent = pair.term;
      termsEl.appendChild(btn);
    });

    var defsEl = document.getElementById("match-defs");
    defsEl.innerHTML = '<div class="match-col-label">Definitions</div>';
    currentDefGroups.forEach(function (group, idx) {
      var btn = document.createElement("button");
      btn.className = "match-item pop-in";
      btn.setAttribute("data-def-index", idx);
      btn.textContent = group.value;
      defsEl.appendChild(btn);
    });
    scheduleEqualise();
  }

  // UNIFORM CARD HEIGHT. Cards grow to their text, so a deck whose definitions
  // are full sentences -- the subject-wide flashcard decks especially -- gives a
  // board of wildly different sized tiles and two columns that drift out of step.
  //
  // A fixed height in CSS would clip the long ones, so instead every card is
  // measured and they all take the height of the tallest. Nothing is hidden and
  // the grid lines up. Recomputed on every render and on resize, because the
  // tallest card changes with the board and with the window width.
  var sizeRaf = 0;
  function equaliseCards() {
    var items = document.querySelectorAll("#match-terms .match-item, #match-defs .match-item");
    if (!items.length) return;
    var i, tallest = 0;
    for (i = 0; i < items.length; i++) items[i].style.height = "auto";
    for (i = 0; i < items.length; i++) {
      var h = items[i].getBoundingClientRect().height;
      if (h > tallest) tallest = h;
    }
    for (i = 0; i < items.length; i++) items[i].style.height = tallest + "px";
  }
  function scheduleEqualise() {
    cancelAnimationFrame(sizeRaf);
    sizeRaf = requestAnimationFrame(equaliseCards);
  }
  // Resizing needs a settling delay, not just a frame. Measuring on the first
  // frame of a width change catches the text mid-rewrap and locks in a height
  // for a layout that no longer exists -- restoring the window from 900px back
  // to full width left every card 151px tall when 128 was correct, until the
  // next render happened to fix it.
  var sizeTimer = 0;
  function equaliseSoon() {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(scheduleEqualise, 120);
  }
  window.addEventListener("resize", equaliseSoon);
  // The site's text-size control rewrites a root font size; re-measure when it
  // does, or the cards keep a height computed for the old size.
  if (window.ResizeObserver) {
    new ResizeObserver(equaliseSoon).observe(document.documentElement);
  }

  function updateStats() {
    document.getElementById("match-progress").textContent = matchedCount + " / " + totalPairs;
    // Notability shows a filling bar with "1/12" above the cards; the timer and
    // best-time stay because this is still a speed run, the bar just makes
    // "how much is left" readable at a glance.
    var pct = totalPairs ? (matchedCount / totalPairs) * 100 : 0;
    document.getElementById("match-bar-fill").style.width = pct.toFixed(1) + "%";
    document.getElementById("match-bar-count").textContent = matchedCount + " / " + totalPairs;
    var best = getMatchBest(deck.id);
    document.getElementById("match-best").textContent = best ? formatMs(best) : "—";
  }

  function tickTimer() {
    var el = document.getElementById("match-timer");
    el.textContent = formatMs(Date.now() - startTime);
  }

  // ---- pair-count control -------------------------------------------------
  function syncSizeInput() {
    var input = document.getElementById("match-size");
    if (!input) return;
    var max = (deck.matchCards || deck.cards || []).length;
    input.max = String(max);
    // Never offer a number larger than the deck: typing 40 into a 14-pair deck
    // should land on 14, not silently do nothing.
    if (WINDOW_SIZE > max) WINDOW_SIZE = max;
    input.value = String(WINDOW_SIZE);
  }

  function applySize(raw) {
    var max = (deck.matchCards || deck.cards || []).length;
    var n = parseInt(raw, 10);
    if (!n || n < 2) n = 2;
    if (n > max) n = max;
    if (n === WINDOW_SIZE) { syncSizeInput(); return; }
    WINDOW_SIZE = n;
    writeWindowSize(n);
    syncSizeInput();
    startGame();          // re-deal: the board size changed under the player
  }

  // ---- fullscreen ---------------------------------------------------------
  // Desktop only, and hidden entirely where the API is unavailable -- iOS
  // Safari has no element fullscreen, so showing a button that does nothing
  // would be worse than not showing one.
  function fullscreenSupported() {
    var el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen);
  }
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function toggleFullscreen() {
    var el = document.documentElement;
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  }
  function syncFullscreenBtn() {
    var btn = document.getElementById("match-fs");
    if (!btn) return;
    var wide = window.matchMedia("(min-width: 820px)").matches;
    var coarse = window.matchMedia("(pointer: coarse)").matches;
    btn.hidden = !(wide && !coarse && fullscreenSupported());
    document.getElementById("match-fs-label").textContent =
      isFullscreen() ? "Exit fullscreen" : "Fullscreen";
    document.body.classList.toggle("is-fullscreen", isFullscreen());
  }

  function startGame() {
    syncSizeInput();
    buildPool(deck);
    selectedTermId = null;
    selectedDefIndex = null;
    matchedCount = 0;
    locked = false;
    renderBoard();
    updateStats();
    document.getElementById("match-timer").textContent = "0.0s";
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 100);
    document.getElementById("game-ui").style.display = "block";
    document.getElementById("view-result").style.display = "none";
  }

  function termEl(pairId) { return document.querySelector('#match-terms [data-pair-id="' + pairId + '"]'); }
  function defEl(defIndex) { return document.querySelector('#match-defs [data-def-index="' + defIndex + '"]'); }

  function handleSelect(side, id) {
    if (locked) return;
    var el = side === "term" ? termEl(id) : defEl(id);
    if (!el) return;

    SOUNDS.select();
    if (side === "term") {
      if (selectedTermId != null) { var prev = termEl(selectedTermId); if (prev) prev.classList.remove("selected"); }
      selectedTermId = id;
    } else {
      if (selectedDefIndex != null) { var prevD = defEl(selectedDefIndex); if (prevD) prevD.classList.remove("selected"); }
      selectedDefIndex = id;
    }
    el.classList.add("selected");

    if (selectedTermId == null || selectedDefIndex == null) return;

    var tId = selectedTermId, dIdx = selectedDefIndex;
    selectedTermId = null;
    selectedDefIndex = null;
    var tEl = termEl(tId), dEl = defEl(dIdx);
    var termPair = active.find(function (p) { return p.pairId === tId; });
    var defGroup = currentDefGroups[dIdx];
    // A tap is correct if the tapped definition's TEXT matches this term's
    // definition -- not by pairId -- so any term sharing that definition
    // (e.g. any retroperitoneal organ) can correctly match the one shared
    // tile, instead of only the one pairId the tile happened to be built
    // from.
    var isMatch = termPair && defGroup && termPair.def === defGroup.value;

    if (isMatch) {
      // If this definition tile still covers other not-yet-matched terms,
      // it stays on the board afterward (no "matched" fade) so those terms
      // can still match against it; it only leaves once every term needing
      // it is cleared.
      var isLastForThisDef = defGroup.pairIds.length === 1;
      SOUNDS.match();
      tEl.classList.remove("selected");
      dEl.classList.remove("selected");
      tEl.classList.add("correct");
      if (isLastForThisDef) dEl.classList.add("correct");
      matchedCount++;
      updateStats();
      locked = true;
      setTimeout(function () {
        tEl.classList.add("matched");
        if (isLastForThisDef) dEl.classList.add("matched");
        setTimeout(function () {
          active = active.filter(function (p) { return p.pairId !== tId; });
          if (pool.length) active.push(pool.shift());
          locked = false;
          if (active.length === 0) {
            clearInterval(timerInterval);
            setTimeout(endGame, 300);
          } else {
            renderBoard();
          }
        }, 250);
      }, 300);
    } else {
      SOUNDS.matchWrong();
      locked = true;
      tEl.classList.add("wrong");
      dEl.classList.add("wrong");
      setTimeout(function () {
        tEl.classList.remove("selected", "wrong");
        dEl.classList.remove("selected", "wrong");
        locked = false;
      }, 500);
    }
  }

  function endGame() {
    var finalMs = Date.now() - startTime;
    var isNewBest = saveMatchBest(deck.id, finalMs);
    bumpStreak();
    document.getElementById("game-ui").style.display = "none";
    document.getElementById("view-result").style.display = "block";
    document.getElementById("result-title").textContent = "Matched in " + formatMs(finalMs) + "!";
    document.getElementById("result-sub").textContent = isNewBest ? "New best time 🌟" : "Best: " + formatMs(getMatchBest(deck.id));
    SOUNDS.win();
    burstConfetti();
  }

  var sizeInput = document.getElementById("match-size");
  if (sizeInput) {
    sizeInput.addEventListener("change", function () { applySize(this.value); });
    // Enter commits without waiting for blur, and stops the keypress reaching
    // the board.
    sizeInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); this.blur(); applySize(this.value); }
      e.stopPropagation();
    });
  }
  var fsBtn = document.getElementById("match-fs");
  if (fsBtn) fsBtn.addEventListener("click", toggleFullscreen);
  ["fullscreenchange", "webkitfullscreenchange"].forEach(function (evt) {
    document.addEventListener(evt, syncFullscreenBtn);
  });
  window.addEventListener("resize", syncFullscreenBtn);
  syncFullscreenBtn();

  document.addEventListener("click", function (e) {
    var termBtn = e.target.closest("#match-terms [data-pair-id]");
    if (termBtn) return handleSelect("term", parseInt(termBtn.getAttribute("data-pair-id"), 10));
    var defBtn = e.target.closest("#match-defs [data-def-index]");
    if (defBtn) return handleSelect("def", parseInt(defBtn.getAttribute("data-def-index"), 10));
    if (e.target.id === "match-again-btn") return startGame();
  });

  initHeader();
  if (!deck) {
    showEmpty("Deck not found.");
  } else if ((deck.matchCards || deck.cards).length < 2) {
    showEmpty("Not enough cards in " + deck.name + " to play Match.");
  } else {
    startGame();
  }
})();
</script>
</body>
</html>
