<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('siteTheme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Progress — PA Quizzes</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>
<style>
  :root{
    --ink:#1b2030; --muted:#6b7280; --line:#e6e8ef; --paper:#f6f7fb; --card:#fff;
    --acc:#218640; --acc-soft:#eef0fd;
    --good:#218640; --good-soft:#e9f7ef; --warn:#b7791f; --warn-soft:#fdf6e3;
    --bad:#dc2626; --bad-soft:#fdecec; --shadow:0 1px 2px rgba(20,22,40,.05),0 8px 24px rgba(20,22,40,.05);
  }
  /* NO dark palette here on purpose. theme.css already applies
     `filter: invert(1) hue-rotate(180deg)` to `body > .wrap` in dark mode, so a
     page that ALSO declares dark colours gets darkened twice and comes back out
     as dark text on a dark ground -- this page measured 1.1:1 and its heading
     was unreadable. Author in light; let the filter flip it. Same defect and
     same fix as review.html. */
  :root[data-theme="light"]{--ink:#1b2030;--muted:#6b7280;--line:#e6e8ef;--paper:#f6f7fb;--card:#fff;
    --acc:#218640;--acc-soft:#eef0fd;--good:#218640;--good-soft:#e9f7ef;--warn:#b7791f;--warn-soft:#fdf6e3;
    --bad:#dc2626;--bad-soft:#fdecec;--shadow:0 1px 2px rgba(20,22,40,.05),0 8px 24px rgba(20,22,40,.05);}
  .review-cta{display:flex;align-items:center;gap:13px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--a-crimson,#df2a44);
    border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin:18px 0 4px;
    text-decoration:none;color:var(--ink);
    transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease;}
  .review-cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(223,42,68,.16);}
  .rc-icon{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;background:var(--a-crimson-soft,#faf2f2);color:var(--a-crimson,#df2a44);}
  .rc-icon svg{width:18px;height:18px;transition:transform .45s cubic-bezier(.34,1.4,.64,1);}
  .review-cta:hover .rc-icon svg{transform:rotate(-160deg);}
  .rc-text{flex:1;min-width:0;display:flex;flex-direction:column;}
  .rc-text b{font-size:15px;font-weight:700;}
  .rc-sub{font-size:12.5px;color:var(--muted);}
  .rc-go{flex:none;color:var(--a-crimson,#df2a44);font-size:19px;font-weight:700;}
  @media (prefers-reduced-motion: reduce){.review-cta,.rc-icon svg{transition:none;}
    .review-cta:hover{transform:none;} .review-cta:hover .rc-icon svg{transform:none;}}

  /* --- Consistency heatmap -------------------------------------------------
     One square per day for the last 18 weeks, tinted by how many questions were
     answered that day. The tint is color-mix()ed from --good rather than a new
     palette, so it tracks the page's own colour in both themes. */
  .hm-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .hm-head .hm-note{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;}
  .hm-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:14px 16px 12px;overflow-x:auto;}
  .hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);
    gap:3px;min-width:max-content;}
  /* The month row has to use the SAME track width and gap as the day grid, or
     the labels drift off their columns -- sized to their own text they walked
     past the right edge of the grid entirely. */
  .hm-months{display:grid;grid-auto-flow:column;grid-auto-columns:13px;gap:3px;
    min-width:max-content;font-size:10.5px;color:var(--muted);
    margin:0 0 5px 22px;height:13px;}
  .hm-months span{white-space:nowrap;overflow:visible;line-height:13px;}
  .hm-body{display:flex;gap:6px;align-items:flex-start;}
  .hm-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;
    color:var(--muted);width:16px;flex:none;}
  .hm-days span{line-height:13px;height:13px;}
  .hm-c{width:13px;height:13px;border-radius:3px;background:var(--l0);
    outline:1px solid rgba(127,127,127,.10);outline-offset:-1px;}
  .hm-c.l1{background:var(--l1)} .hm-c.l2{background:var(--l2)}
  .hm-c.l3{background:var(--l3)} .hm-c.l4{background:var(--l4)}
  .hm-c.future{background:transparent;outline:none;}
  .hm-c.today{outline:2px solid var(--good);outline-offset:1px;}
  .hm-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-top:11px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .hm-foot b{color:var(--ink);font-weight:700;}
  .hm-key{display:flex;align-items:center;gap:4px;}
  .hm-key .hm-c{width:11px;height:11px;}
  .hm-wrapc{
    --l0: color-mix(in oklab, var(--good) 7%, var(--card));
    --l1: color-mix(in oklab, var(--good) 26%, var(--card));
    --l2: color-mix(in oklab, var(--good) 48%, var(--card));
    --l3: color-mix(in oklab, var(--good) 72%, var(--card));
    --l4: var(--good);
  }
  .hm-c{transition:transform var(--dur-1,160ms) var(--ease,cubic-bezier(.2,.8,.2,1));}
  .hm-c:not(.future):hover{transform:scale(1.35);}
  @media (prefers-reduced-motion: reduce){.hm-c{transition:none} .hm-c:hover{transform:none}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:26px 18px 90px;}
  .back-link{display:inline-block;color:var(--muted);text-decoration:none;font-size:13.5px;margin-bottom:14px;}
  .back-link:hover{color:var(--acc)}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px;}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  @media(max-width:620px){.cards{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);}
  .stat .n{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;}
  .stat.acc .n{color:var(--acc)}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 12px;}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin:9px 0;box-shadow:var(--shadow);}
  .row .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .row .name{font-weight:700;font-size:15px;}
  .row .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .row .pct{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;}
  .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:9px;}
  .bar > i{display:block;height:100%;border-radius:5px;}
  .g{color:var(--good)} .w{color:var(--warn)} .b{color:var(--bad)}
  .fill-g{background:var(--good)} .fill-w{background:var(--warn)} .fill-b{background:var(--bad)}
  a.focus{display:block;text-decoration:none;color:inherit;}
  a.focus:hover .row{border-color:var(--acc)}
  .rec{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 2px;border-bottom:1px solid var(--line);}
  .rec:last-child{border-bottom:0}
  .rec .rn{color:var(--ink)} .rec .rd{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .rec .rs{font-weight:700;font-variant-numeric:tabular-nums;}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:40px 24px;text-align:center;color:var(--muted);}
  .empty a{color:var(--acc);font-weight:700;text-decoration:none;}
  .note{font-size:12px;color:var(--muted);margin-top:26px;text-align:center;}

  /* --- empty state ------------------------------------------------- */
  .empty-state { text-align:center; padding:44px 24px 40px; }
  .empty-art { width:190px; height:92px; margin:0 auto 6px; display:block; overflow:visible; }
  .empty-art line { stroke:var(--line,#e5e7eb); stroke-width:2; stroke-linecap:round; }
  .empty-art .b { fill:var(--acc,#218640); opacity:.16; transform-box:fill-box; transform-origin:bottom;
                  animation:bar-grow .62s cubic-bezier(.2,.8,.2,1) both; }
  .empty-art .b2 { opacity:.26; animation-delay:.07s }
  .empty-art .b3 { opacity:.38; animation-delay:.14s }
  .empty-art .b4 { opacity:.55; animation-delay:.21s }
  @keyframes bar-grow { from { transform:scaleY(.05); } }
  .empty-title { margin:14px 0 4px; font-size:17px; font-weight:700; color:var(--ink,#1f2937); }
  .empty-sub { margin:0 auto 20px; max-width:38ch; font-size:14px; color:var(--muted,#6b7280); line-height:1.55; }
  .empty-cta { display:inline-block; padding:10px 20px; border-radius:999px; text-decoration:none;
               background:var(--acc,#218640); color:#fff; font-weight:700; font-size:14px; }
  .empty-cta:hover { filter:brightness(1.08); }
  @media (prefers-reduced-motion: reduce) { .empty-art .b { animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Home</a>
  <h1>My Progress</h1>
  <p class="sub" id="sub">Your quiz history on this device.</p>
  <div id="dash"></div>
  <p class="note">Tracked from the quizzes you complete. Signed in with Google (Settings)? Your progress follows you across devices.</p>
</div>

<script>
(function () {
  function readCompletions() {
    var out = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf("qc:") !== 0) continue;
      var rec; try { rec = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
      if (!rec || typeof rec.total !== "number" || rec.total <= 0 || typeof rec.score !== "number") continue;
      var raw = k.slice(3);                       // "/Anatomy%20Exam%204/...html"
      var dec = raw; try { dec = decodeURIComponent(raw); } catch (e) {}
      var parts = dec.replace(/^\//, "").split("/");
      var folder = parts.length > 1 ? parts[0] : "Other";
      var file = parts[parts.length - 1].replace(/\.html$/, "");
      out.push({ href: raw, folder: folder, name: quizName(file), score: rec.score, total: rec.total });
    }
    return out;
  }
  function quizName(file) {
    var m = file.match(/-(?:version|v|set)-?(\d+)$/i);
    var setNum = m ? m[1] : null;
    var base = file.replace(/-(?:version|v|set)-?\d+$/i, "").replace(/-quiz$/, "").replace(/[-_]+/g, " ").trim();
    base = base.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    base = base.replace(/\bAnd\b/g, "&").replace(/\bOian\b/i, "O.I.A.N.").replace(/\bPd1\b/i, "PD1")
               .replace(/\bGi\b/g, "GI").replace(/\bCam\b/g, "CAM").replace(/\bPa\b/g, "PA");
    return setNum ? base + " (Set " + setNum + ")" : base;
  }
  function grade(pct) { return pct >= 80 ? "g" : pct >= 60 ? "w" : "b"; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function computeStreak(log) {
    if (!log || !log.length) return 0;
    var days = {};
    log.forEach(function (e) { var d = new Date(e.t); days[d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate()] = true; });
    function key(dt) { return dt.getFullYear() + "-" + dt.getMonth() + "-" + dt.getDate(); }
    var d = new Date(), streak = 0;
    if (!days[key(d)]) d.setDate(d.getDate() - 1); // grace: still counts if you studied yesterday
    while (days[key(d)]) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }
  function relDate(t) {
    var diff = Date.now() - t, day = 86400000;
    if (diff < 60000) return "just now";
    if (diff < day && new Date(t).getDate() === new Date().getDate()) return "today";
    if (diff < 2 * day) return "yesterday";
    if (diff < 7 * day) return Math.floor(diff / day) + "d ago";
    return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }


  // --- Consistency heatmap ---------------------------------------------------
  // Reads the same progressLog the streak uses. Counts QUESTIONS per day rather
  // than quizzes, because a 60-question master exam and a 20-question quiz are
  // not the same amount of work and colouring them identically would flatter
  // the wrong day.
  function heatmap(log) {
    var WEEKS = 18, DAY = 86400000;
    var perDay = {};                       // "y-m-d" -> questions answered
    (log || []).forEach(function (e) {
      var d = new Date(e.t);
      var k = d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
      perDay[k] = (perDay[k] || 0) + (e.n || 0);
    });
    function key(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

    // Start on the Sunday of the week containing (today - 17 weeks), so every
    // column is a whole week and the day-of-week rows line up.
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var start = new Date(today.getTime() - (WEEKS - 1) * 7 * DAY);
    start.setDate(start.getDate() - start.getDay());

    var counts = [], best = { n: 0, d: null };
    for (var i = 0; i < WEEKS * 7; i++) {
      var d = new Date(start.getTime() + i * DAY);
      var n = perDay[key(d)] || 0;
      counts.push(n);
      if (n > best.n) { best = { n: n, d: new Date(d) }; }
    }
    var active = counts.filter(function (n) { return n > 0; });
    // Thresholds from the user's own busiest day, so the scale stays meaningful
    // whether they do 20 questions a day or 300.
    var peak = Math.max.apply(null, counts.concat([1]));
    function level(n) {
      if (!n) return "";
      if (n >= peak * 0.66) return " l4";
      if (n >= peak * 0.40) return " l3";
      if (n >= peak * 0.18) return " l2";
      return " l1";
    }

    var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var months = '', lastMon = -1;
    for (var w = 0; w < WEEKS; w++) {
      var first = new Date(start.getTime() + w * 7 * DAY);
      var label = '';
      if (first.getMonth() !== lastMon) { label = MON[first.getMonth()]; lastMon = first.getMonth(); }
      months += '<span>' + label + '</span>';
    }

    var cells = '';
    for (var col = 0; col < WEEKS; col++) {
      for (var row = 0; row < 7; row++) {
        var idx = col * 7 + row;
        var dt = new Date(start.getTime() + idx * DAY);
        if (dt > today) { cells += '<i class="hm-c future"></i>'; continue; }
        var n = counts[idx];
        var when = DOW[dt.getDay()] + " " + dt.getDate() + " " + MON[dt.getMonth()];
        var lab = n ? n + (n === 1 ? " question" : " questions") + " \u00b7 " + when
                    : "nothing on " + when;
        cells += '<i class="hm-c' + level(n) + (idx === Math.floor((today - start) / DAY) ? ' today' : '') +
                 '" title="' + lab + '"></i>';
      }
    }

    var streak = computeStreak(log);
    var daysOn = active.length;
    var foot = '<span><b>' + streak + '</b> day streak \u00b7 <b>' + daysOn +
               '</b> of the last ' + (WEEKS * 7) + ' days studied';
    if (best.d) {
      foot += ' \u00b7 best <b>' + best.n + '</b> on ' + best.d.getDate() + ' ' + MON[best.d.getMonth()];
    }
    foot += '</span>';
    foot += '<span class="hm-key">less <i class="hm-c"></i><i class="hm-c l1"></i>' +
            '<i class="hm-c l2"></i><i class="hm-c l3"></i><i class="hm-c l4"></i> more</span>';

    return '<h2 class="hm-head">Consistency <span class="hm-note">last ' + WEEKS +
           ' weeks</span></h2>' +
           '<div class="hm-card hm-wrapc">' +
             '<div class="hm-months">' + months + '</div>' +
             '<div class="hm-body">' +
               '<div class="hm-days"><span></span><span>M</span><span></span><span>W</span>' +
                 '<span></span><span>F</span><span></span></div>' +
               '<div class="hm-grid">' + cells + '</div>' +
             '</div>' +
             '<div class="hm-foot">' + foot + '</div>' +
           '</div>';
  }

  function render() {
    var quizzes = readCompletions();
    var dash = document.getElementById("dash");
    if (!quizzes.length) {
      // An empty progress page is often someone's first impression of
      // whether any of this works, so show what it WILL look like rather
      // than a bare line of text in a white box.
      dash.innerHTML =
        '<div class="empty-state">' +
          '<svg class="empty-art" viewBox="0 0 200 96" aria-hidden="true">' +
            '<line x1="12" y1="84" x2="188" y2="84"/>' +
            '<rect class="b b1" x="26"  y="58" width="22" height="26" rx="4"/>' +
            '<rect class="b b2" x="60"  y="44" width="22" height="40" rx="4"/>' +
            '<rect class="b b3" x="94"  y="30" width="22" height="54" rx="4"/>' +
            '<rect class="b b4" x="128" y="20" width="22" height="64" rx="4"/>' +
          '</svg>' +
          '<p class="empty-title">No quizzes finished yet</p>' +
          '<p class="empty-sub">Finish any quiz and your accuracy, weakest topics and ' +
            'streak all show up here \u2014 no setup needed.</p>' +
          '<a class="empty-cta" href="index.html">Take a quiz &rarr;</a>' +
        '</div>';
      return;
    }
    var log = []; try { log = JSON.parse(localStorage.getItem("progressLog")) || []; } catch (e) {}

    var totalQ = 0, totalC = 0;
    var byFolder = {};
    quizzes.forEach(function (q) {
      totalQ += q.total; totalC += q.score;
      var f = byFolder[q.folder] || (byFolder[q.folder] = { n: 0, c: 0, count: 0 });
      f.n += q.total; f.c += q.score; f.count++;
    });
    var overall = Math.round(totalC / totalQ * 100);
    var streak = computeStreak(log);

    var html = '';
    html += '<div class="cards">' +
      stat(quizzes.length, "quizzes completed") +
      stat(totalQ.toLocaleString(), "questions answered") +
      stat(overall + "%", "overall accuracy", "acc") +
      stat(streak + (streak === 1 ? " day" : " days"), "study streak") +
      '</div>';

    html += heatmap(log);

    // By exam
    var folders = Object.keys(byFolder).sort();
    html += '<h2>Accuracy by exam</h2>';
    folders.forEach(function (f) {
      var d = byFolder[f], pct = Math.round(d.c / d.n * 100), g = grade(pct);
      html += '<div class="row"><div class="top"><span class="name">' + esc(f) + '</span>' +
        '<span class="pct ' + g + '">' + pct + '%</span></div>' +
        '<div class="meta">' + d.count + ' quiz' + (d.count === 1 ? '' : 'zes') + ' · ' + d.c + '/' + d.n + ' correct</div>' +
        '<div class="bar"><i class="fill-' + g + '" style="width:' + pct + '%"></i></div></div>';
    });

    // Review call-to-action. "Focus areas" below tells you which QUIZZES went
    // badly; this points at the individual questions you actually missed,
    // which is the part you can do something about right now.
    var missedTotal = 0, missedQuizzes = 0;
    try {
      for (var mi = 0; mi < localStorage.length; mi++) {
        var mk = localStorage.key(mi);
        if (!mk || mk.indexOf("qm:") !== 0) continue;
        var mrec = JSON.parse(localStorage.getItem(mk));
        if (mrec && mrec.m && mrec.m.length) { missedTotal += mrec.m.length; missedQuizzes++; }
      }
    } catch (e) {}
    if (missedTotal) {
      html += '<a class="review-cta" href="review.html">' +
        '<span class="rc-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></span>' +
        '<span class="rc-text"><b>' + missedTotal + ' question' + (missedTotal === 1 ? '' : 's') + ' to review</b>' +
        '<span class="rc-sub">across ' + missedQuizzes + ' quiz' + (missedQuizzes === 1 ? '' : 'zes') + ' &middot; drill them one by one</span></span>' +
        '<span class="rc-go" aria-hidden="true">&rarr;</span></a>';
    }

    // Focus areas: lowest-accuracy quizzes
    var worst = quizzes.slice().map(function (q) { return { q: q, pct: Math.round(q.score / q.total * 100) }; })
      .sort(function (a, b) { return a.pct - b.pct; }).slice(0, 6);
    if (worst.length && worst[0].pct < 100) {
      html += '<h2>Focus areas — lowest scores</h2>';
      worst.forEach(function (w) {
        if (w.pct >= 90) return;
        var g = grade(w.pct);
        html += '<a class="focus" href="' + w.q.href + '"><div class="row"><div class="top">' +
          '<span class="name">' + esc(w.q.name) + '</span><span class="pct ' + g + '">' + w.pct + '%</span></div>' +
          '<div class="meta">' + esc(w.q.folder) + ' · ' + w.q.score + '/' + w.q.total + ' · tap to retake</div></div></a>';
      });
    }

    // Recent activity
    if (log.length) {
      html += '<h2>Recent activity</h2><div class="row" style="padding:6px 16px">';
      log.slice(-8).reverse().forEach(function (e) {
        var dec = e.p; try { dec = decodeURIComponent(e.p); } catch (x) {}
        var file = dec.replace(/^\//, "").split("/").pop().replace(/\.html$/, "");
        var pct = e.n ? Math.round(e.s / e.n * 100) : 0;
        html += '<div class="rec"><span class="rn">' + esc(quizName(file)) + '</span>' +
          '<span><span class="rs ' + grade(pct) + '">' + pct + '%</span> &nbsp;<span class="rd">' + relDate(e.t) + '</span></span></div>';
      });
      html += '</div>';
    }

    dash.innerHTML = html;
  }
  function stat(n, l, cls) {
    return '<div class="stat ' + (cls || '') + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>';
  }

  render();
  // cloud-sync pulls a signed-in user's history down asynchronously on load;
  // re-render shortly after so cross-device data appears without a manual reload.
  setTimeout(render, 2500);
})();
</script>
