<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('siteTheme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Calendar</title>
<link rel="stylesheet" href="theme.css">
<script src="semesters.js"></script>
<script src="calendar-data.js"></script>
<script src="theme.js" defer></script>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-2K06TXC2KK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-2K06TXC2KK');

<style>
  /* Teal is this page's surface hue -- the sixth accent in theme.css's ring and
     the one no other page had claimed. Same recipe as the rest, no new hex. */
  :root { --accent: var(--a-teal); --accent-soft: var(--a-teal-soft); }

  html, body { overscroll-behavior-y: contain; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  .wrap { max-width: 900px; margin: 0 auto; padding: 26px 18px 120px; }
  .back-link {
    display: inline-block; font-size: 14px; color: var(--muted);
    text-decoration: none; margin-bottom: 14px;
  }
  .back-link:hover { color: var(--accent); }
  .eyebrow {
    font-size: 12px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
  }
  h1 { font-size: 30px; margin: 0 0 6px; color: var(--ink); }
  .lede { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin: 0 0 20px; max-width: 66ch; }

  /* ---- controls ------------------------------------------------------- */
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg); padding: 10px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip-row + .chip-row { margin-top: 8px; }
  .chip {
    font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 5px 11px; border-radius: var(--r-pill);
    border: 1px solid var(--border); background: var(--card);
    color: var(--muted); cursor: pointer; line-height: 1.4;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.exam-toggle.active { background: var(--a-crimson); border-color: var(--a-crimson); }
  .today-btn { margin-left: auto; }

  /* ---- agenda --------------------------------------------------------- */
  .month { margin: 0 0 30px; }
  .month-head {
    font-size: 13px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .day {
    display: grid; grid-template-columns: 74px 1fr; gap: 14px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .day:last-child { border-bottom: 0; }
  .day-label { text-align: right; padding-top: 2px; }
  .day-dow { font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); display: block; }
  .day-num { font-size: 21px; font-weight: 800; color: var(--ink);
    font-variant-numeric: tabular-nums; line-height: 1.1; }
  .day.is-today .day-num,
  .day.is-today .day-dow { color: var(--accent); }
  .day.is-today .day-num::after {
    content: ""; display: block; height: 3px; border-radius: 2px;
    background: var(--accent); margin-top: 3px;
  }
  .day.is-past { opacity: .48; }

  .ev { display: flex; gap: 9px; align-items: baseline; padding: 3px 0; }
  .ev-time {
    flex: 0 0 auto; min-width: 5.6em; font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .ev-title { font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  .ev-tag {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; padding: 1px 6px; border-radius: var(--r-sm);
    margin-right: 7px; vertical-align: 1px; white-space: nowrap;
  }
  .ev.k-exam .ev-title { font-weight: 700; }
  .ev.k-exam .ev-tag { color: var(--a-crimson); background: var(--a-crimson-soft);
    border: 1px solid color-mix(in oklab, var(--a-crimson) 22%, transparent); }
  .ev.k-retest .ev-tag, .ev.k-remediation .ev-tag {
    color: var(--a-amber); background: var(--a-amber-soft);
    border: 1px solid color-mix(in oklab, var(--a-amber) 22%, transparent); }
  .ev.k-holiday .ev-tag { color: var(--a-green); background: var(--a-green-soft);
    border: 1px solid color-mix(in oklab, var(--a-green) 22%, transparent); }
  .ev.k-holiday .ev-title { color: var(--muted); }
  .ev.k-lab .ev-tag, .ev.k-activity .ev-tag {
    color: var(--a-teal); background: var(--a-teal-soft);
    border: 1px solid color-mix(in oklab, var(--a-teal) 22%, transparent); }
  .ev.k-lecture .ev-title { color: var(--muted); }

  .empty { text-align: center; padding: 46px 20px; color: var(--muted); }
  .empty-title { font-size: 17px; font-weight: 800; color: var(--ink); margin: 0 0 6px; }

  .page-foot { margin-top: 34px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .page-foot button {
    font: inherit; background: none; border: 0; padding: 0;
    color: var(--accent); text-decoration: underline; cursor: pointer;
  }

  @media (max-width: 560px) {
    h1 { font-size: 24px; }
    .day { grid-template-columns: 54px 1fr; gap: 10px; }
    .day-num { font-size: 18px; }
    .ev { flex-direction: column; gap: 1px; }
    .ev-time { min-width: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Homepage</a>
  <div class="eyebrow">Class of 2028</div>
  <h1>Academic Calendar</h1>
  <p class="lede" id="lede"></p>

  <div class="controls">
    <div class="chip-row" id="sem-row"></div>
    <div class="chip-row" id="course-row"></div>
    <div class="chip-row">
      <button class="chip exam-toggle" id="exams-only" type="button">Exams only</button>
      <button class="chip today-btn" id="jump-today" type="button">Jump to today</button>
    </div>
  </div>

  <div id="agenda"></div>

  <div class="page-foot">
    Taken from the printed academic calendar. The school revises it during the term
    &mdash; <button type="button" id="report-btn">tell me if a date is wrong</button>.
  </div>
</div>

<script>
(function () {
  "use strict";

  var cal = window.CalendarData, reg = window.Semesters;
  var agenda = document.getElementById("agenda");
  if (!cal || !reg) return;

  var COURSE_LABEL = {
    "cms-1": "CMS I",
    "pdm-1": "PDM I",
    "microbiology": "Microbiology",
    "pharm-1": "Pharmacology I",
    "physical-diagnosis-2": "Physical Diagnosis 2",
    "clin-path-1": "Clinical Pathophysiology I",
    "med-lit": "Medical Literature",
    "physio": "Physiology",
    "anatomy": "Anatomy",
    "anatomy-practicum": "Anatomy Practicum",
    "physical-diagnosis": "Physical Diagnosis 1",
    "cam-nutrition": "CAM/Nutrition",
    "pharmacodynamics": "Pharmacodynamics",
    "intro-pa": "Intro to PA Profession"
  };
  var KIND_TAG = {
    exam: "Exam", retest: "Retest", remediation: "Remediation",
    lab: "Lab", activity: "Session", holiday: "No class"
  };

  function ymd(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  var TODAY = ymd(new Date());

  /* Only offer a semester that actually has events -- Spring and Summer II are
     in the registry long before their calendars exist. */
  var semsWithData = reg.all.filter(function (s) { return cal.forSemester(s.id).length; });
  var state = {
    sem: (reg.current() && cal.forSemester(reg.current().id).length)
           ? reg.current().id
           : (semsWithData.length ? semsWithData[semsWithData.length - 1].id : null),
    course: null,
    examsOnly: false
  };

  function makeChip(row, label, isActive, onClick, cls) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (cls ? " " + cls : "") + (isActive ? " active" : "");
    b.textContent = label;
    b.addEventListener("click", onClick);
    row.appendChild(b);
    return b;
  }

  function renderChips() {
    var semRow = document.getElementById("sem-row");
    var courseRow = document.getElementById("course-row");
    semRow.innerHTML = "";
    courseRow.innerHTML = "";

    if (semsWithData.length > 1) {
      semsWithData.forEach(function (s) {
        makeChip(semRow, s.label, s.id === state.sem, function () {
          state.sem = s.id; state.course = null; render();
        });
      });
    }

    var courses = [];
    cal.forSemester(state.sem).forEach(function (e) {
      if (e.c && courses.indexOf(e.c) === -1) courses.push(e.c);
    });
    makeChip(courseRow, "All classes", state.course === null, function () {
      state.course = null; render();
    });
    courses.forEach(function (c) {
      makeChip(courseRow, COURSE_LABEL[c] || c, state.course === c, function () {
        state.course = c; render();
      });
    });

    var toggle = document.getElementById("exams-only");
    toggle.classList.toggle("active", state.examsOnly);
  }

  function visibleEvents() {
    return cal.forSemester(state.sem).filter(function (e) {
      if (state.course && e.c !== state.course) return false;
      // "Exams only" means graded: exams, retests and course remediation.
      if (state.examsOnly && !cal.isGraded(e)) return false;
      return true;
    });
  }

  function render() {
    renderChips();
    var evs = visibleEvents();
    var sem = reg.byId(state.sem);

    var graded = evs.filter(function (e) { return cal.isGraded(e); }).length;
    document.getElementById("lede").textContent = sem
      ? sem.label + " — " + evs.length + " scheduled item" + (evs.length === 1 ? "" : "s") +
        ", " + graded + " of them graded. Times are as printed; the school moves them."
      : "";

    agenda.innerHTML = "";
    if (!evs.length) {
      agenda.innerHTML = '<div class="empty"><p class="empty-title">Nothing scheduled</p>' +
        '<p>No calendar entries match that filter.</p></div>';
      return;
    }

    // group -> month -> day, preserving the data's date order
    var months = [];
    var byMonth = {};
    evs.forEach(function (e) {
      var mk = e.d.slice(0, 7);
      if (!byMonth[mk]) { byMonth[mk] = { key: mk, days: {}, order: [] }; months.push(byMonth[mk]); }
      var m = byMonth[mk];
      if (!m.days[e.d]) { m.days[e.d] = []; m.order.push(e.d); }
      m.days[e.d].push(e);
    });

    months.forEach(function (m) {
      var p = m.key.split("-");
      var monthDate = new Date(+p[0], +p[1] - 1, 1);
      var sec = document.createElement("section");
      sec.className = "month";
      var h = document.createElement("h2");
      h.className = "month-head";
      h.textContent = monthDate.toLocaleDateString("en-US", { month: "long", year: "numeric" });
      sec.appendChild(h);

      m.order.forEach(function (dk) {
        var dp = dk.split("-");
        var dd = new Date(+dp[0], +dp[1] - 1, +dp[2]);
        var row = document.createElement("div");
        row.className = "day" + (dk === TODAY ? " is-today" : "") + (dk < TODAY ? " is-past" : "");
        if (dk === TODAY) row.id = "today";

        var lab = document.createElement("div");
        lab.className = "day-label";
        lab.innerHTML = '<span class="day-dow">' +
          dd.toLocaleDateString("en-US", { weekday: "short" }) + '</span>' +
          '<span class="day-num">' + dd.getDate() + '</span>';
        row.appendChild(lab);

        var list = document.createElement("div");
        m.days[dk].forEach(function (e) {
          var ev = document.createElement("div");
          ev.className = "ev k-" + e.k;
          var time = document.createElement("span");
          time.className = "ev-time";
          time.textContent = e.h ? e.h.replace(/:00/, "").toLowerCase() : "";
          var title = document.createElement("span");
          title.className = "ev-title";
          if (KIND_TAG[e.k]) {
            var tag = document.createElement("span");
            tag.className = "ev-tag";
            tag.textContent = KIND_TAG[e.k];
            title.appendChild(tag);
          }
          title.appendChild(document.createTextNode(e.t));
          ev.appendChild(time);
          ev.appendChild(title);
          list.appendChild(ev);
        });
        row.appendChild(list);
        sec.appendChild(row);
      });
      agenda.appendChild(sec);
    });
  }

  document.getElementById("exams-only").addEventListener("click", function () {
    state.examsOnly = !state.examsOnly; render();
  });
  document.getElementById("jump-today").addEventListener("click", function () {
    var el = document.getElementById("today");
    if (el) { el.scrollIntoView({ block: "center" }); return; }
    // Nothing today -- go to the next day that has something on it instead.
    var next = visibleEvents().filter(function (e) { return e.d > TODAY; })[0];
    if (!next) return;
    var rows = agenda.querySelectorAll(".day");
    for (var i = 0; i < rows.length; i++) {
      if (!rows[i].classList.contains("is-past")) { rows[i].scrollIntoView({ block: "center" }); return; }
    }
  });
  document.getElementById("report-btn").addEventListener("click", function () {
    if (window.reportMistake) window.reportMistake();
  });

  render();
})();
</script>
</body>
</html>
