<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · PA Quizzes</title>
<script>
  // GitHub Pages also answers /page for /page.html, so old shared or bookmarked
  // links of that form exist. Retry once with ".html" before showing the 404.
  // No loop: a path ending in ".html" (or "/", or any extension) is never retried.
  (function () {
    var p = location.pathname;
    if (/\/[^\/.]+$/.test(p)) location.replace(p + ".html" + location.search + location.hash);
  })();
</script>
<style>
  :root { --bg: #f6f8fc; --card: #ffffff; --ink: #1d2433; --muted: #5a6478; --accent: #2a6df2; --accent-ink: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151d; --card: #1a202b; --ink: #e8ecf3; --muted: #a3adbf; --accent: #6f9bff; --accent-ink: #0b1220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { background: var(--card); max-width: 440px; width: 100%; padding: 32px 28px; border-radius: 16px;
         box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: inline-block; background: var(--accent); color: var(--accent-ink); text-decoration: none;
          font-weight: 600; padding: 12px 22px; border-radius: 999px; }
  a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page isn't here. It may have moved, or the link may be mistyped.</p>
  <a class="btn" href="/PA_Quizzes/">Go to PA Quizzes</a>
</main>
</body>
</html>
