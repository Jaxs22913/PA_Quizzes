<title>Clinical Medicine and Surgery I &middot; Exam 6 &mdash; Study Guide</title>
<style>
  :root{
    --ink:#251e33;
    --paper:#faf6f6;
    --accent:#7a2d30;      /* crimson (Exam 6, the quiz palette navy) */
    --accent2:#c08a2e;      /* warm gold */
    --accent3:#b45357;      /* light crimson */
    --line:#e8dcdc;
    --soft:#665b62;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
  }
  header.top{
    background:linear-gradient(120deg,#4a1a1d,var(--accent) 55%,#d9939a);
    color:#fff;
    padding:34px 26px 30px;
  }
  header.top h1{
    margin:0 0 6px;
    font-size:2rem;
    letter-spacing:.2px;
    font-weight:800;
  }
  header.top p{margin:2px 0;color:#f7e8e8;font-size:.95rem;}
  header.top .hdr-note{margin-top:12px;font-size:.86rem;background:rgba(255,255,255,.14);
    display:inline-block;padding:7px 13px;border-radius:9px;}
  header.top .hdr-links{margin-top:14px;display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
  header.top .hdr-links a{font-size:.83rem;font-weight:700;color:#fff;text-decoration:none;
    border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 14px;}
  header.top .hdr-links a:hover{background:rgba(255,255,255,.16);}
  header.top .hdr-save{margin-top:12px;font-size:.8rem;opacity:.85;}
  @media print{ header.top .hdr-links, header.top .hdr-save{display:none !important;} }

  .layout{display:flex;max-width:1180px;margin:0 auto;}
  nav.toc{
    position:sticky;top:38px;align-self:flex-start;
    width:280px;min-width:280px;max-height:calc(100vh - 38px);max-height:calc(100dvh - 38px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:24px 18px;border-right:1px solid var(--line);
    background:#f3e9e9;
    font-size:.85rem;
  }
  nav.toc h2{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin:14px 0 6px;}
  nav.toc a{display:block;color:var(--soft);text-decoration:none;padding:3px 0;border-bottom:1px solid transparent;}
  nav.toc a.top-link{font-weight:700;color:var(--accent2);margin-top:10px;}
  nav.toc a:hover{color:var(--accent);}
  main{flex:1;padding:30px 40px 90px;min-width:0;}
  section.deck{margin-bottom:56px;scroll-margin-top:18px;}
  h2.deck-title{
    font-size:1.55rem;color:var(--accent);
    border-bottom:3px solid var(--accent2);
    padding-bottom:8px;margin:0 0 6px;
    font-weight:800;
  }
  .lecturer{color:var(--soft);font-style:italic;font-size:.9rem;margin-bottom:14px;}
  .io-box{
    background:#f5e9e9;border:1px solid var(--line);
    border-radius:10px;padding:14px 18px;margin:14px 0 20px;
  }
  .io-box h3{
    margin:0 0 8px;font-size:.8rem;text-transform:uppercase;
    letter-spacing:1px;color:var(--accent3);
  }
  .io-box ol{margin:0;padding-left:20px;}
  .io-box li{margin-bottom:5px;font-size:.92rem;}
  h3.sub{
    color:var(--accent3);font-size:1.14rem;margin:26px 0 6px;font-weight:800;
  }
  h4.subsub{
    color:var(--accent2);font-size:.98rem;margin:16px 0 4px;
    font-weight:700;
  }
  ul,ol{margin:6px 0 12px;}
  li{margin-bottom:3px;}
  p{margin:8px 0;}
  .callout{
    border-left:4px solid var(--accent3);
    background:#efeaf4;padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0;
  }
  .pearl{
    border-left:4px solid var(--accent2);
    background:#f8f0e2;padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0;
  }
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.9rem;}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}
  th{background:var(--accent);color:#fff;font-weight:700;}
  tr:nth-child(even) td{background:#f5eded;}
  code{background:#ecdfdf;padding:1px 5px;border-radius:4px;font-size:.85rem;}
  .tag{
    display:inline-block;background:var(--accent2);color:#fff;
    font-size:.68rem;
    padding:2px 8px;border-radius:10px;letter-spacing:.5px;
    vertical-align:middle;margin-left:8px;
  }
  figure.fig{
    margin:18px 0;padding:12px;background:#f3e9e9;border-radius:10px;
    border:1px solid var(--line);text-align:center;
  }
  figure.fig img{
    max-width:100%;height:auto;border-radius:6px;background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
  }
  figure.fig figcaption{
    margin-top:8px;font-size:13.5px;color:var(--soft);font-style:italic;line-height:1.45;
  }
  .test-yourself-btn{
    display:inline-block;margin-top:18px;padding:10px 18px;border:none;border-radius:999px;
    background:var(--acc,var(--accent));color:#fff;font-weight:700;font-size:.92rem;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .test-yourself-btn:hover{filter:brightness(1.08);}
  footer.guide-foot{margin:34px 40px 0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--soft);}
  @media(max-width:820px){
    nav.toc{display:none;}
    main{padding:22px 18px 60px;}
    footer.guide-foot{margin:34px 18px 0;}
  }

  /* header.top sits outside .wrap (full-bleed banner) so it needs its own
     dark-mode invert -- everything else lives inside .layout.wrap and gets
     the site-wide body > .wrap invert from theme.css for free. */
  :root[data-theme="dark"] header.top { filter: invert(1) hue-rotate(180deg); }

  html, body { overscroll-behavior-y: contain; }
  #pull-refresh {
    position: fixed; top: 0; left: 0; right: 0; height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: transparent; z-index: 1000;
  }
  #pull-refresh svg { width: 100%; height: 44px; }
  #pull-refresh path {
    fill: none; stroke: #6a4fa3; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 420; stroke-dashoffset: 420;
  }
  #pull-refresh.refreshing path { animation: ekg-sweep 0.9s linear infinite; }
  @keyframes ekg-sweep { 0% { stroke-dashoffset: 420; } 100% { stroke-dashoffset: -420; } }


  /* Disease photograph strips (added 2026-08-20). Images are shared with the
     dermatology comparison chart -- same directory, same files, no duplicates.
     Images here are eager, never lazy: an image that never scrolled into view
     is absent from Download as PDF, which cost 74 of 84 photographs on the
     chart before it was caught. */
  .figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
    gap:12px;margin:16px 0;padding:14px;background:#f2e9eb;border-radius:10px;
    border:1px solid var(--line)}
  .figgrid figure{margin:0;text-align:center;display:flex;flex-direction:column}
  .figgrid img{width:100%;height:132px;object-fit:contain;border-radius:6px;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .figgrid .fg-nopic{width:100%;height:132px;border-radius:6px;background:#fff;
    border:1px dashed var(--line);display:flex;align-items:center;
    justify-content:center;font-size:11.5px;color:var(--soft);padding:8px;
    line-height:1.35;box-sizing:border-box}
  .figgrid figcaption{margin-top:7px;font-size:12px;line-height:1.35;color:var(--soft)}
  .figgrid .fg-name{display:block;font-weight:700;color:var(--ink);font-size:12.5px;
    margin-bottom:2px}
  .figgrid .fg-cite{display:block;font-size:10.5px;margin-top:3px;opacity:1;color:var(--soft)}
  .figgrid-h{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--soft);margin:0 0 4px}
  @media (max-width:520px){.figgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
    .figgrid img,.figgrid .fg-nopic{height:112px}}
  /* The GRID must be allowed to break -- a ten-condition strip is taller than a
     page, so `break-inside:avoid` on the grid cannot be honoured and Chrome
     splits it through the middle of a figure instead, clipping the photograph
     and orphaning its caption. Let the grid fragment between rows and protect
     the individual figure, which always fits. */
  @media print{.figgrid{break-inside:auto;background:#f7f2f3}
    .figgrid figure{break-inside:avoid;page-break-inside:avoid}
    .figgrid img,.figgrid .fg-nopic{break-inside:avoid}}

  /* First-line treatment tables (add_guide_ophtho_treatment.py). The condition
     column is held narrow so the treatment text gets the width; the urgency
     column is narrower still and never wraps mid-word. */
  .txnote{font-size:13px;line-height:1.5;color:var(--soft);margin:0 0 10px}
  table.txtab td.txc{width:200px;font-weight:700;vertical-align:top}
  table.txtab td{vertical-align:top;font-size:14px;line-height:1.5}
  table.txtab .txu{width:120px;font-size:12.5px;line-height:1.4}
  table.txtab td.txu{font-weight:700}
  @media(max-width:700px){
    table.txtab td.txc{width:auto;display:block;border-bottom:none;padding-bottom:0}
    table.txtab td:not(.txc){display:block;border-top:none;padding-top:3px}
    table.txtab .txu{width:auto}
  }

  /* Condition blocks (.cond / dl.eight) use --c-* tokens, defined here as in Exam 5. */
  :root{--c-line:var(--line);--c-ice:#faefee;--c-mute:var(--soft);--c-panel:var(--accent);--c-panel-fg:#fff;}
  .callout.warn{border-left-color:#b4541a;background:#fbeee4;}
  .callout.audio-note{border-left-color:#c1873a;background:#fff7e6;}
  .audio-pending{display:inline-block;vertical-align:middle;margin-left:8px;font-size:.62rem;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;color:#7a5a08;background:#fff3d4;border:1px solid #e3c46a;
    border-radius:999px;padding:1px 8px;white-space:nowrap;}
  .cite{font-style:normal;font-size:.72rem;opacity:.85;}
</style>

<style>
  /* Professor-emphasized content. Star + highlight, per the convention set by
     the CAM/Nutrition guide. Here the marks come from each lecture recording
     (minutes spoken, repetition, explicit "know this"). */
  .prof-flag{
    border:2px solid #d4a017;border-radius:10px;padding:16px 14px 6px;
    margin:22px 0 14px;position:relative;background:#fffdf5;
  }
  .prof-flag-label{
    position:absolute;top:-13px;left:14px;background:#fef3d4;color:#8a6205;
    font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:8px;
    border:1px solid #d4a017;letter-spacing:.3px;
  }
  .prof-flag table{margin:6px 0 8px;}
  mark.prof-highlight{
    background:#fef3d4;color:#3a2c05;padding:0 3px;border-radius:3px;
    box-shadow:inset 0 0 0 1px #e8c766;
  }
  :root[data-theme="dark"] .prof-flag{background:#241f10;border-color:#a8801a;}
  :root[data-theme="dark"] .prof-flag-label{
    background:#3a2f12;color:#f0d98a;border-color:#a8801a;
  }
  :root[data-theme="dark"] mark.prof-highlight{
    background:#4a3a12;color:#f7ecc8;box-shadow:inset 0 0 0 1px #7a6220;
  }
  .footer-mark-ink { stroke: #251e33; }
  .footer-mark-accent { stroke: #6a4fa3; }
  @media (prefers-color-scheme: dark) {
    .footer-mark-ink { stroke: #e5e7eb; }
    .footer-mark-accent { stroke: #cdbde9; }
  }
</style>
